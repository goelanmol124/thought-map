<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thought Map: question-driven brainstorming and idea mapping</title>
    <meta name="description" content="Brainstorm by answering one question at a time. Thought Map grows your answers and follow-up questions into a mind-map style tree, saved locally in your browser and exportable to Markdown." />

    <!-- BLOCKING THEME SCRIPT (Prevents flash of light) -->
    <!-- This must run before the body renders -->
    <script>
      (function() {
        try {
          // Same key the app writes on toggle; default is dark.
          const isDark = localStorage.getItem('theme') !== 'light';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // Fallback to dark if something goes wrong
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-stone-50 dark:bg-slate-900 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
